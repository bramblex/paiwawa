server {
    listen 127.0.0.1:8080;
    listen [::1]:8080;

    server_name paiwawa.site;

    root /var/www/paiwawa.site/current;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/paiwawa.site/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite content-hashed bundles can be cached permanently.
    location ~* "^/assets/.+-[A-Za-z0-9_-]{8,}\.(?:js|css|woff|woff2)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        access_log off;
    }

    location ~* \.glb$ {
        try_files $uri =404;
        default_type model/gltf-binary;
        add_header Cache-Control "public, max-age=86400, s-maxage=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        access_log off;
    }

    # Stable game-asset URLs stay short in browsers and longer at the CDN edge.
    location ~* ^/assets/.*\.(?:js|css|woff|woff2|png|jpg|jpeg|webp|avif|svg|ico|ogg|mp3|wav|json|xml|txt)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400, s-maxage=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        access_log off;
    }

    location ~* \.(?:png|jpg|jpeg|webp|avif|svg|ico|json|xml|txt)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600, s-maxage=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        access_log off;
    }
}

server {
    listen 127.0.0.1:8443 ssl;
    listen [::1]:8443 ssl;

    server_name paiwawa.site;

    root /var/www/paiwawa.site/current;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

    ssl_certificate /etc/letsencrypt/live/paiwawa.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paiwawa.site/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location = /index.html {
        add_header Cache-Control "no-cache";
