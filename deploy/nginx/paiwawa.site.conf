server {
    listen 127.0.0.1:8080;
    listen [::1]:8080;

    server_name paiwawa.site;

    root /var/www/paiwawa.site/current;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/paiwawa.site/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.glb$ {
        try_files $uri =404;
        default_type model/gltf-binary;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        access_log off;
    }

    location ~* \.(?:js|css|woff|woff2|png|jpg|jpeg|webp|ogg|mp3|json)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        access_log off;
    }
}

server {
    listen 127.0.0.1:8443 ssl;
    listen [::1]:8443 ssl;

    server_name paiwawa.site;

    root /var/www/paiwawa.site/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/paiwawa.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paiwawa.site/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/paiwawa.site/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.glb$ {
        try_files $uri =404;
        default_type model/gltf-binary;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        access_log off;
    }

    location ~* \.(?:js|css|woff|woff2|png|jpg|jpeg|webp|ogg|mp3|json)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        access_log off;
    }
}
